<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <meta
      name="description"
      content="Website digunakan untuk mengetahui cuaca pada sebuah kota"
    />
    <meta name="author" content="Ardivan Nur Raihan Rahman" />
    <meta name="robots" content="index, follow" />

    <meta property="og:locale" content="id" />
    <meta property="og:url" content="https://weather-app-prjct.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Weather App" />
    <meta
      property="og:description"
      content="Website digunakan untuk mengetahui cuaca pada sebuah kota"
    />
    <meta
      property="og:image"
      content="https://weather-app-prjct.vercel.app/assets/og.png"
    />
    <link rel="shortcut icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Project Weather App | Ardivan</title>
  </head>
  <body>
    <div class="container">
      <h1>Weather App</h1>

      <form action="" class="weatherForm">
        <input type="text" name="cityInput" class="cityInput" placeholder="Enter city" />
        <button type="submit">Get Weather</button>
      </form>

      <div class="card">
        <div class="card-left">
          <h2 class="cityDisplay"></h2>
          <p class="tempDisplay"></p>
          <p class="humidityDisplay"></p>
          <p class="weatherDisplay"></p>
          <p class="descDisplay"></p>
        </div>
        <div class="card-right">
          <img class="weatherEmoji" src="" alt="Weather Icon"></img>
        </div>
      </div>

      <p class="errorDisplay"></p>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
